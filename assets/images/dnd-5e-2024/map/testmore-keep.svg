  </g>
  <rect class="feature" x="420" y="140" width="40" height="20" />
  <line class="door" x1="0" y1="150" x2="10" y2="150" />
  <line class="door" x1="120" y1="125" x2="130" y2="125" />
  <line class="door" x1="120" y1="170" x2="130" y2="170" />
  <line class="door" x1="310" y1="75" x2="320" y2="75" />
  <line class="door" x1="310" y1="220" x2="320" y2="220" />
  <line class="door" x1="560" y1="150" x2="570" y2="150" />
</svg>
