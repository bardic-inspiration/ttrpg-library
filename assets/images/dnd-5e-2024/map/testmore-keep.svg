<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300">
  <title>Testmore Keep</title>
  <rect class="wall" x="0" y="0" width="700" height="300" />
  <g id="zone-gatehouse" class="zone">
    <rect x="10" y="110" width="110" height="80" />
    <text class="label" x="65" y="154">Gatehouse</text>
  </g>
  <g id="zone-shrine-of-seals" class="zone">
    <rect x="130" y="10" width="180" height="130" />
    <text class="label" x="220" y="79">Shrine of Seals</text>
  </g>
  <g id="zone-fallen-armory" class="zone">
    <rect x="130" y="150" width="180" height="140" />
