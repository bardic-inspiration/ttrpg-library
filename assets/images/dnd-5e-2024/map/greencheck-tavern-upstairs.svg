<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260">
  <title>Greencheck Tavern Upstairs</title>
  <rect class="wall" x="0" y="0" width="500" height="260" />
  <g id="zone-landing" class="zone">
    <rect x="10" y="90" width="120" height="80" />
    <text class="label" x="70" y="134">Landing</text>
  </g>
  <g id="zone-guest-rooms" class="zone">
    <rect x="140" y="10" width="170" height="110" />
    <text class="label" x="225" y="69">Guest Rooms</text>
  </g>
  <g id="zone-keepers-room" class="zone">
    <rect x="140" y="130" width="170" height="120" />
    <text class="label" x="225" y="194">Keeper's Room</text>
  </g>
  <g id="zone-storage-loft" class="zone">
    <rect x="320" y="10" width="170" height="240" />
    <text class="label" x="405" y="134">Storage Loft</text>
  </g>
  <line class="door" x1="130" y1="105" x2="140" y2="105" />
  <line class="door" x1="130" y1="150" x2="140" y2="150" />
  <line class="door" x1="310" y1="60" x2="320" y2="60" />
</svg>
