# SPEC.md §12.4 "Labeling": lane labels from the branch prefix, area labels
# from changed paths, using the rules in .github/labeler.yml. Runs on
# pull_request_target so it can write labels; it only reads PR metadata and
# changed paths, and never checks out or runs PR code.
name: labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
