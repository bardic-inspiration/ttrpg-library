# Content lane (docs/generation.md#requests). A routine turns this into a small revise PR.
name: Revise request
description: Ask a routine to change entries that are already merged.
labels: [revise]
body:
  - type: textarea
    id: ids
    attributes:
      label: Entry IDs
      description: Each entry to revise, one per line, as `<type>/<id>` (for example `spell/fireball`). A bare `id` works when only one type has it.
      placeholder: |
        creature/tidewrack-hulk
    validations:
      required: true
  - type: textarea
    id: instruction
    attributes:
      label: Instruction
      description: What to change, and why.
    validations:
      required: true
