# Lane and area labels (docs/workflow.md#labeling), applied by workflows/labeler.yml.
# `migration` goes on a dev-lane PR that changes content, so a migration needs
# no manual step and stays visible in review.

content:
  - head-branch: ['^gen/', '^revise/', '^manual/']

dev:
  - head-branch: ['^(?!gen/|revise/|manual/|spike/)']

# Area labels apply to dev-lane PRs only.
ui:
  - all:
      - head-branch: ['^(?!gen/|revise/|manual/|spike/)']
      - changed-files:
          - any-glob-to-any-file: 'site/**'

ruleset:
  - all:
      - head-branch: ['^(?!gen/|revise/|manual/|spike/)']
      - changed-files:
          # Some file under rulesets/ that isn't a guideline.
          - all-globs-to-any-file: ['rulesets/**', '!rulesets/*/guidelines/**']

generation:
  - all:
      - head-branch: ['^(?!gen/|revise/|manual/|spike/)']
      - changed-files:
          - any-glob-to-any-file:
              - 'rulesets/*/guidelines/**'
              - '.claude/skills/**'
              - 'config/defaults.json'
              - 'docs/routines.md'

ci:
  - all:
      - head-branch: ['^(?!gen/|revise/|manual/|spike/)']
      - changed-files:
          - any-glob-to-any-file: '.github/**'

migration:
  - all:
      - head-branch: ['^(?!gen/|revise/|manual/)']
      - changed-files:
          - any-glob-to-any-file: ['content/**', 'assets/images/**']
